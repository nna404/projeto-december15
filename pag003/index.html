<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria</title>
    <link rel="stylesheet" href="pag003.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>
   <nav class="cima">
        <a href="../index.html" id="botao-home">Home</a>
   </nav>

    <div class="header-gallery">
        <h2>Pérolas</h2>
        <p>Te descreveria assim...</p>
    </div>

    <div class="gallery-scroll-container">
        
        <div class="gallery-card">
            <img src="images/ling-mulheres.jpeg" class="gallery-thumb" alt="Teoria" 
            data-caption="Você explicando como funciona a linguagem das mulheres kkkkkkkkkkk">
            <div class="card-name">A Teoria</div>
        </div>

        <div class="gallery-card">
            <img src="images/perola-emoji-1.jpeg" class="gallery-thumb" alt="Emojis"
            data-caption="Você e suas loucuras....">
            <div class="card-name">Emojis I</div>
        </div>

        <div class="gallery-card">
            <img src="images/perola-emoji-2.jpeg" class="gallery-thumb" alt="Emojis 2"
            data-caption="Eu sempre amei suas mensagens um tanto quanto imprevisiveis.">
            <div class="card-name">Emojis II</div>
        </div>

        <div class="gallery-card">
            <img src="images/humor-alterado-1.jpeg" class="gallery-thumb" alt="Humor"
            data-caption="Uma hora você tá assim...">
            <div class="card-name">Fase 1</div>
        </div>

        <div class="gallery-card">
            <img src="images/humor-alterado-2.jpeg" class="gallery-thumb" alt="Humor 2"
            data-caption="E na outra hora assim kkkkkkkk">
            <div class="card-name">Fase 2</div>
        </div>

        <div class="gallery-card">
            <img src="images/odeia-homem.jpeg" class="gallery-thumb" alt="Ódio"
            data-caption="Nunca entendi você falando mal dos homens sendo que você conversa comigo, mas tudo bem kkkkkk">
            <div class="card-name">Contradição?</div>
        </div>

        <div class="gallery-card">
            <img src="images/lavar-1.jpeg" class="gallery-thumb" alt="Louça"
            data-caption="Nossas brincadeiras...">
            <div class="card-name">Louça I</div>
        </div>

        <div class="gallery-card">
            <img src="images/lavar-2.jpeg" class="gallery-thumb" alt="Louça 2"
            data-caption="Sempre dou risada quando releio tal conversa kkkkkk">
            <div class="card-name">Louça II</div>
        </div>

        <div class="gallery-card">
            <img src="images/toxica.jpeg" class="gallery-thumb" alt="Tóxica"
            data-caption="Você sendo você mesma... Mas eu sempre obedecia">
            <div class="card-name">Personalidade</div>
        </div>

        <div class="gallery-card">
            <img src="images/medo-1.jpeg" class="gallery-thumb" alt="Medo"
            data-caption="Uma história engraçada sobre como ambos sabiamos que era só questão de tempo.">
            <div class="card-name">Questão de Tempo</div>
        </div>

        <div class="gallery-card">
            <img src="images/medo-2.jpeg" class="gallery-thumb" alt="Filme"
            data-caption="Você quando admitiu que assistiu o filme só por minha causa kkkkkkkk">
            <div class="card-name">O Filme</div>
        </div>

        <div class="gallery-card">
            <img src="images/pref-1.jpeg" class="gallery-thumb" alt="Preferida"
            data-caption="Uma das fotos que sempre dou risada quando lembro">
            <div class="card-name">Favorita I</div>
        </div>

        <div class="gallery-card">
            <img src="images/WhatsApp Image 2025-12-12 at 21.13.19.jpeg" class="gallery-thumb" alt="Preferida 2"
            data-caption="Com certeza foi bem espontaneo tirar essa foto">
            <div class="card-name">Favorita II</div>
        </div>

        <div class="gallery-card">
            <img src="images/capa-do-video.jpeg" class="gallery-thumb" alt="Nosso Vídeo"
            data-caption="Aqueles momentos que nunca vou me arrepender de ter gravado..."
            data-video="images/bem.mp4">
            <div class="card-name" style="color: var(--gold-light);">🎬 O Registro</div>
        </div>

    </div>

    <div id="imageModal" class="modal">
        <span class="close-btn">&times;</span>
        
        <div class="modal-body">
            <img class="modal-content" id="img01">
            
            <video id="video01" controls style="display: none; width: 100%; max-height: 60vh; border-radius: 4px; border: 1px solid var(--gold-primary); margin-bottom: 15px;">
                <source src="" type="video/mp4">
                Seu navegador não suporta vídeos.
            </video>
            
            <div id="caption"></div>
        </div>
    </div>
    
    <nav class="baixo">
         <a href="../Pag002/index.html" id="botao-voltar">Retornar</a>
         <a href="../pag004/index.html" id="botao-avancar">Avançar</a>
    </nav>

    <script src="script_galeria.js"></script>

</body>
</html>
